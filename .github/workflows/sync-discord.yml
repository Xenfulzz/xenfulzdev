name: Sync Discord profile

# Copies the Discord profile picture and colour onto the site once a day.
# Needs the repository secret DISCORD_BOT_TOKEN.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch profile picture and colour
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 .github/scripts/sync_discord.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- profile.png style.css; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.png style.css
          git commit -m "Sync Discord profile picture and colour"
          git push
